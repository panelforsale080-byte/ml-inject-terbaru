name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK + NDK
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;26.1.10909125"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify main application APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          BADGING=$( "${ANDROID_HOME}/build-tools/34.0.0/aapt2" dump badging "$APK" )
          echo "$BADGING" | head -20
          echo "$BADGING" | grep -q "package: name='com.enjoyers'" || exit 1
          echo "$BADGING" | grep -q "application-label" || exit 1
          echo "$BADGING" | grep -q "launchable-activity" || exit 1
          unzip -l "$APK" | grep -E 'lib/.*/librizeyt\.so' || exit 1
          echo "OK: com.enjoyers application APK with librizeyt.so"

      - uses: actions/upload-artifact@v4
        with:
          name: ml-inject-terbaru-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
